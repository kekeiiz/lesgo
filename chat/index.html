<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LesGo · Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #b8cfe0 0%, #d2e4f0 100%);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .chat-container {
      display: flex;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 40px rgba(0,0,0,0.1);
    }
    .chat-sidebar {
      width: 320px;
      background: white;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 1.5rem;
      background: #3a4a5a;
      color: white;
    }
    .sidebar-header h2 {
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      margin-top: 1rem;
      font-size: 0.8rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      justify-content: center;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateX(-2px);
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
    }
    .chat-list-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-list-item:hover, .chat-list-item.active {
      background: #f0f7e8;
    }
    .chat-avatar {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #c8d8e8, #a0b8d0);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .chat-info {
      flex: 1;
    }
    .chat-name {
      font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .chat-preview {
      font-size: 0.75rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-time {
      font-size: 0.7rem;
      color: #999;
    }
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f8faf8;
    }
    .chat-header {
      padding: 1rem 1.5rem;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .chat-header-avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #c8d8e8, #a0b8d0);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .chat-header-info h3 { margin-bottom: 0.2rem; }
    .chat-header-info p { font-size: 0.75rem; color: #4f772d; }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      display: flex;
      max-width: 70%;
    }
    .message.sent {
      align-self: flex-end;
      justify-content: flex-end;
    }
    .message.received {
      align-self: flex-start;
    }
    .message-bubble {
      padding: 0.75rem 1rem;
      border-radius: 1.2rem;
      max-width: 100%;
    }
    .message.sent .message-bubble {
      background: linear-gradient(135deg, #d4f59e, #c0e87a);
      color: #1a3a2a;
      border-bottom-right-radius: 0.3rem;
    }
    .message.received .message-bubble {
      background: white;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 0.3rem;
    }
    .message-time {
      font-size: 0.65rem;
      color: #999;
      margin-top: 0.2rem;
      text-align: right;
    }
    .message-input-area {
      padding: 1rem 1.5rem;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 1rem;
    }
    .message-input-area input {
      flex: 1;
      padding: 0.8rem 1rem;
      border: 1px solid #ddd;
      border-radius: 2rem;
      font-family: 'Inter', sans-serif;
    }
    .message-input-area button {
      background: linear-gradient(135deg, #d4f59e, #c0e87a);
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 2rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .message-input-area button:hover {
      transform: scale(1.02);
    }
    .empty-state {
      text-align: center;
      color: #999;
      padding: 3rem;
    }
    @media (max-width: 768px) {
      .chat-sidebar { width: 280px; }
      .message { max-width: 85%; }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-sidebar">
      <div class="sidebar-header">
        <h2><i class="fas fa-comment-dots"></i> Messages</h2>
        <button class="back-btn" id="backToDashboardBtn">
          <i class="fas fa-arrow-left"></i> Back to Dashboard
        </button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>
    
    <div class="chat-main">
      <div id="chatMainArea">
        <div class="empty-state" style="height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center;">
          <i class="fas fa-comments" style="font-size:3rem; color:#ccc; margin-bottom:1rem;"></i>
          <p>Select a chat to start messaging</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const AVAILABLE_TUTORS = [
      { id: 1, name: "Emma Rodriguez", subject: "Mathematics (Calculus)", avatar: "ER", online: true },
      { id: 2, name: "Dr. James Chen", subject: "Physics", avatar: "JC", online: true },
      { id: 3, name: "Sarah Johnson", subject: "English Literature", avatar: "SJ", online: false },
      { id: 4, name: "Michael Lee", subject: "Computer Science", avatar: "ML", online: true },
      { id: 5, name: "Prof. Anna Williams", subject: "Chemistry", avatar: "AW", online: false },
    ];

    let currentUser = null;
    let userChats = [];
    let currentChatTutor = null;
    let messages = {};

    function loadUserData() {
      const storedUser = localStorage.getItem('lesgo_user');
      if (!storedUser) {
        window.location.href = '../landing/index.html';
        return;
      }
      currentUser = JSON.parse(storedUser);
      
      const storedChats = localStorage.getItem(`lesgo_chats_${currentUser.username}`);
      userChats = storedChats ? JSON.parse(storedChats) : [];
      
      const storedMessages = localStorage.getItem(`lesgo_messages_${currentUser.username}`);
      messages = storedMessages ? JSON.parse(storedMessages) : {};
    }

    function saveMessages() {
      localStorage.setItem(`lesgo_messages_${currentUser.username}`, JSON.stringify(messages));
    }

    function saveChats() {
      localStorage.setItem(`lesgo_chats_${currentUser.username}`, JSON.stringify(userChats));
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentChatTutor) return;
      
      if (!messages[currentChatTutor.id]) {
        messages[currentChatTutor.id] = [];
      }
      
      messages[currentChatTutor.id].push({
        text: text,
        sentBy: 'user',
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      
      setTimeout(() => {
        if (currentChatTutor) {
          messages[currentChatTutor.id].push({
            text: `Thanks for your message! I'll get back to you shortly.`,
            sentBy: 'tutor',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          saveMessages();
          renderMessages();
          updateChatPreview(currentChatTutor.id, text);
        }
      }, 800);
      
      saveMessages();
      updateChatPreview(currentChatTutor.id, text);
      renderMessages();
      input.value = '';
    }

    function updateChatPreview(tutorId, lastMessage) {
      const chat = userChats.find(c => c.tutorId === tutorId);
      if (chat) {
        chat.lastMessage = lastMessage.slice(0, 40) + (lastMessage.length > 40 ? '...' : '');
        chat.timestamp = new Date().toISOString();
        saveChats();
        renderChatList();
      }
    }

    function renderChatList() {
      const chatListDiv = document.getElementById('chatList');
      if (userChats.length === 0) {
        chatListDiv.innerHTML = '<div class="empty-state" style="padding:2rem;"><i class="fas fa-comment-slash"></i><p>No chats yet<br>Go back and start a chat with a tutor!</p></div>';
        return;
      }
      
      chatListDiv.innerHTML = userChats.map(chat => {
        const tutor = AVAILABLE_TUTORS.find(t => t.id === chat.tutorId);
        const isActive = currentChatTutor && currentChatTutor.id === chat.tutorId;
        return `
          <div class="chat-list-item ${isActive ? 'active' : ''}" data-tutor-id="${chat.tutorId}">
            <div class="chat-avatar">${chat.tutorAvatar}</div>
            <div class="chat-info">
              <div class="chat-name">${chat.tutorName}</div>
              <div class="chat-preview">${chat.lastMessage || 'Say hello!'}</div>
            </div>
            <div class="chat-time">${new Date(chat.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
          </div>
        `;
      }).join('');
      
      document.querySelectorAll('.chat-list-item').forEach(item => {
        item.addEventListener('click', () => {
          const tutorId = parseInt(item.dataset.tutorId);
          const tutor = AVAILABLE_TUTORS.find(t => t.id === tutorId);
          if (tutor) {
            openChat(tutor);
          }
        });
      });
    }

    function openChat(tutor) {
      currentChatTutor = tutor;
      
      if (!messages[tutor.id]) {
        messages[tutor.id] = [];
        if (messages[tutor.id].length === 0) {
          messages[tutor.id].push({
            text: `👋 Hi! I'm ${tutor.name}. I specialize in ${tutor.subject}. How can I help you today?`,
            sentBy: 'tutor',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          saveMessages();
        }
      }
      
      renderMessages();
      renderChatList();
    }

    function renderMessages() {
      const mainArea = document.getElementById('chatMainArea');
      if (!currentChatTutor) {
        mainArea.innerHTML = `
          <div class="empty-state" style="height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center;">
            <i class="fas fa-comments" style="font-size:3rem; color:#ccc;"></i>
            <p>Select a chat to start messaging</p>
          </div>
        `;
        return;
      }
      
      const chatMessages = messages[currentChatTutor.id] || [];
      
      mainArea.innerHTML = `
        <div class="chat-header">
          <div class="chat-header-avatar">${currentChatTutor.avatar}</div>
          <div class="chat-header-info">
            <h3>${currentChatTutor.name}</h3>
            <p><i class="fas fa-circle" style="font-size:0.6rem; color:${currentChatTutor.online ? '#4f772d' : '#999'};"></i> ${currentChatTutor.online ? 'Online' : 'Offline'} · ${currentChatTutor.subject}</p>
          </div>
        </div>
        <div class="messages-area" id="messagesArea">
          ${chatMessages.map(msg => `
            <div class="message ${msg.sentBy === 'user' ? 'sent' : 'received'}">
              <div class="message-bubble">
                ${msg.text}
                <div class="message-time">${msg.time}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="message-input-area">
          <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
      `;
      
      const messagesArea = document.getElementById('messagesArea');
      if (messagesArea) {
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }
      
      const input = document.getElementById('messageInput');
      if (input) input.focus();
    }

    function checkForSpecificChat() {
      const tutorIdToOpen = sessionStorage.getItem('openChatWithTutor');
      if (tutorIdToOpen) {
        sessionStorage.removeItem('openChatWithTutor');
        const tutor = AVAILABLE_TUTORS.find(t => t.id === parseInt(tutorIdToOpen));
        if (tutor && userChats.some(c => c.tutorId === tutor.id)) {
          openChat(tutor);
        }
      }
    }

    // BACK BUTTON - goes directly to landing page (which will show dashboard if logged in)
    document.getElementById('backToDashboardBtn')?.addEventListener('click', () => {
      window.location.href = '../landing/index.html';
    });

    loadUserData();
    renderChatList();
    checkForSpecificChat();
    
    window.sendMessage = sendMessage;
  </script>
</body>
</html>
