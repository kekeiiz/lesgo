<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - LesGo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🎓 LesGo</div>
        <div class="nav-links">
            <span id="memberBadge" class="member-badge" style="display:none;">⭐ MEMBER 20% OFF</span>
            <a href="dashboard.html">Dashboard</a>
            <a href="transaction.html">Transaksi</a>
            <a href="profile.html">Profil</a>
            <a href="login.html" onclick="localStorage.clear()">Logout</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="welcome-card">
            <h1>Selamat Datang, <span id="userName"></span>! 👋</h1>
            <p id="membershipInfo"></p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">📚 Total Les<br><span id="totalLessons">0</span></div>
            <div class="stat-card">💰 Total Belanja<br><span id="totalSpent">Rp 0</span></div>
            <div class="stat-card">⭐ Rating Anda<br>★★★★★</div>
        </div>

        <div class="section-title">🎯 Rekomendasi Guru</div>
        <div class="teachers-grid" id="recommendations"></div>
    </div>

    <script>
        const memberUstadz = ["ustadz.ahmad@lesgo.com", "ustadz.budi@lesgo.com", "ustadz.cecep@lesgo.com", "ustadz.dian@lesgo.com", "ustadz.eka@lesgo.com"];
        
        const email = localStorage.getItem('userEmail');
        const isMember = memberUstadz.includes(email);
        
        document.getElementById('userName').innerText = email.split('@')[0];
        
        if (isMember) {
            document.getElementById('memberBadge').style.display = 'inline';
            document.getElementById('membershipInfo').innerHTML = '✅ Anda adalah <strong>Member Premium</strong>! Dapatkan diskon 20% untuk setiap transaksi.';
        } else {
            document.getElementById('membershipInfo').innerHTML = '💡 Daftar menjadi member premium (hubungi admin) untuk diskon 20%!';
        }
        
        // Data rekomendasi guru
        const teachers = [
            { name: "Ustadz Ahmad", subject: "Tahfidz", price: 40000, isMember: true },
            { name: "Ustadz Budi", subject: "Tahsin", price: 40000, isMember: true },
            { name: "Bu Rina", subject: "Matematika", price: 50000, isMember: false }
        ];
        
        const container = document.getElementById('recommendations');
        teachers.forEach(t => {
            container.innerHTML += `
                <div class="teacher-card">
                    👨‍🏫 ${t.name}<br>
                    <small>${t.subject}</small><br>
                    <span class="price">Rp${t.price}</span>
                    ${t.isMember ? '<span class="member-badge">⭐ MEMBER</span>' : ''}
                    <br><a href="transaction.html" class="btn-small">Booking</a>
                </div>
            `;
        });
    </script>
</body>
</html>
