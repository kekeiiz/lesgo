<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LesGo · Tutor Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #b8cfe0 0%, #d2e4f0 100%);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .chat-container {
      display: flex;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      background: rgba(255,255,255,0.95);
    }
    .chat-sidebar {
      width: 320px;
      background: white;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 1.5rem;
      background: #3a4a5a;
      color: white;
    }
    .sidebar-header h2 { font-size: 1.3rem; display: flex; align-items: center; gap: 0.5rem; }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      margin-top: 1rem;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: center;
    }
    .back-btn:hover { background: rgba(255,255,255,0.3); }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-list-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-list-item:hover, .chat-list-item.active { background: #f0f7e8; }
    .chat-avatar {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #c8d8e8, #a0b8d0);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .chat-info { flex: 1; }
    .chat-name { font-weight: 700; }
    .chat-preview { font-size: 0.75rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f8faf8;
    }
    .chat-header {
      padding: 1rem 1.5rem;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      display: flex;
      max-width: 70%;
    }
    .message.sent { align-self: flex-end; justify-content: flex-end; }
    .message.received { align-self: flex-start; }
    .message-bubble {
      padding: 0.75rem 1rem;
      border-radius: 1.2rem;
    }
    .message.sent .message-bubble {
      background: linear-gradient(135deg, #d4f59e, #c0e87a);
      border-bottom-right-radius: 0.3rem;
    }
    .message.received .message-bubble {
      background: white;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 0.3rem;
    }
    .message-time { font-size: 0.65rem; color: #999; margin-top: 0.2rem; }
    .message-input-area {
      padding: 1rem 1.5rem;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 1rem;
    }
    .message-input-area input {
      flex: 1;
      padding: 0.8rem 1rem;
      border: 1px solid #ddd;
      border-radius: 2rem;
      font-family: 'Inter', sans-serif;
    }
    .message-input-area button {
      background: linear-gradient(135deg, #d4f59e, #c0e87a);
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 2rem;
      cursor: pointer;
      font-weight: 600;
    }
    .empty-state { text-align: center; color: #999; padding: 3rem; }
    @media (max-width: 768px) {
      .chat-sidebar { width: 280px; }
      .message { max-width: 85%; }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-sidebar">
      <div class="sidebar-header">
        <h2><i class="fas fa-comment-dots"></i> Student Messages</h2>
        <button class="back-btn" id="backToAdminBtn"><i class="fas fa-arrow-left"></i> Back to Dashboard</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>
    <div class="chat-main">
      <div id="chatMainArea">
        <div class="empty-state"><i class="fas fa-comments" style="font-size:3rem; margin-bottom:1rem;"></i><p>Select a student to start messaging</p></div>
      </div>
    </div>
  </div>

  <script>
    let currentTutor = null;
    let studentChats = [];
    let currentStudent = null;
    let messages = {};

    function loadData() {
      const storedUser = localStorage.getItem('lesgo_user');
      if (!storedUser || !JSON.parse(storedUser).isAdmin) {
        window.location.href = '../main/index.html';
        return;
      }
      currentTutor = JSON.parse(storedUser);
      
      // Load students from orders
      const allOrders = JSON.parse(localStorage.getItem('lesgo_orders')) || [];
      const studentsMap = new Map();
      
      allOrders.forEach(order => {
        if (order.items.some(item => item.name.toLowerCase().includes('james'))) {
          if (!studentsMap.has(order.customer.email)) {
            studentsMap.set(order.customer.email, {
              id: studentsMap.size + 1,
              name: order.customer.fullName,
              email: order.customer.email,
              avatar: order.customer.fullName.slice(0,2).toUpperCase(),
              subject: order.items[0].subject
            });
          }
        }
      });
      
      if (studentsMap.size === 0) {
        // Demo students
        studentChats = [
          { id: 1, name: "Emma Johnson", email: "emma@example.com", avatar: "EJ", subject: "Physics", lastMessage: "Hi! When is our next session?" },
          { id: 2, name: "Michael Lee", email: "michael@example.com", avatar: "ML", subject: "Physics", lastMessage: "Thanks for the help!" },
          { id: 3, name: "Sarah Chen", email: "sarah@example.com", avatar: "SC", subject: "Physics", lastMessage: "Can we cover mechanics?" },
        ];
      } else {
        studentChats = Array.from(studentsMap.values()).map(s => ({ ...s, lastMessage: "Say hello!" }));
      }
      
      const storedMessages = localStorage.getItem(`lesgo_tutor_messages_${currentTutor.username}`);
      messages = storedMessages ? JSON.parse(storedMessages) : {};
      
      // Check for specific student from sessionStorage
      const studentToOpen = sessionStorage.getItem('adminChatWithStudent');
      if (studentToOpen) {
        sessionStorage.removeItem('adminChatWithStudent');
        const student = studentChats.find(s => s.name === studentToOpen);
        if (student) openChat(student);
      }
      
      renderChatList();
    }

    function saveMessages() { 
      localStorage.setItem(`lesgo_tutor_messages_${currentTutor.username}`, JSON.stringify(messages)); 
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentStudent) return;
      
      if (!messages[currentStudent.id]) messages[currentStudent.id] = [];
      messages[currentStudent.id].push({ text, sentBy: 'tutor', time: new Date().toLocaleTimeString() });
      saveMessages();
      
      // Auto-reply from student
      setTimeout(() => {
        if (currentStudent) {
          if (!messages[currentStudent.id]) messages[currentStudent.id] = [];
          messages[currentStudent.id].push({ 
            text: `Thanks for your message! I'll prepare for our next session.`, 
            sentBy: 'student', 
            time: new Date().toLocaleTimeString() 
          });
          saveMessages();
          renderMessages();
          updateChatPreview(currentStudent.id, text);
        }
      }, 1000);
      
      updateChatPreview(currentStudent.id, text);
      renderMessages();
      input.value = '';
    }

    function updateChatPreview(studentId, lastMessage) {
      const chat = studentChats.find(c => c.id === studentId);
      if (chat) { 
        chat.lastMessage = lastMessage.slice(0, 40); 
        renderChatList();
      }
    }

    function renderChatList() {
      const container = document.getElementById('chatList');
      container.innerHTML = studentChats.map(chat => `
        <div class="chat-list-item ${currentStudent?.id === chat.id ? 'active' : ''}" data-id="${chat.id}">
          <div class="chat-avatar">${chat.avatar}</div>
          <div class="chat-info">
            <div class="chat-name">${chat.name}</div>
            <div class="chat-preview">${chat.lastMessage || 'Say hello!'}</div>
          </div>
        </div>
      `).join('');
      
      document.querySelectorAll('.chat-list-item').forEach(item => {
        item.addEventListener('click', () => {
          const student = studentChats.find(s => s.id === parseInt(item.dataset.id));
          if (student) openChat(student);
        });
      });
    }

    function openChat(student) {
      currentStudent = student;
      if (!messages[student.id]) { 
        messages[student.id] = [
          { text: `👋 Hi ${student.name}! I'm your tutor. How can I help you today?`, sentBy: 'tutor', time: new Date().toLocaleTimeString() }
        ]; 
        saveMessages(); 
      }
      renderMessages();
      renderChatList();
    }

    function renderMessages() {
      const mainArea = document.getElementById('chatMainArea');
      if (!currentStudent) { 
        mainArea.innerHTML = '<div class="empty-state"><i class="fas fa-comments" style="font-size:3rem;"></i><p>Select a student to start messaging</p></div>'; 
        return; 
      }
      
      const chatMessages = messages[currentStudent.id] || [];
      mainArea.innerHTML = `
        <div class="chat-header">
          <div class="chat-avatar">${currentStudent.avatar}</div>
          <div>
            <h3>${currentStudent.name}</h3>
            <p style="font-size:0.75rem; color:#4f772d;">📚 ${currentStudent.subject} student</p>
          </div>
        </div>
        <div class="messages-area" id="messagesArea">
          ${chatMessages.map(msg => `
            <div class="message ${msg.sentBy === 'tutor' ? 'sent' : 'received'}">
              <div class="message-bubble">
                ${msg.text}
                <div class="message-time">${msg.time}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="message-input-area">
          <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
      `;
      
      const msgsArea = document.getElementById('messagesArea');
      if (msgsArea) msgsArea.scrollTop = msgsArea.scrollHeight;
      document.getElementById('messageInput')?.focus();
    }

    document.getElementById('backToAdminBtn')?.addEventListener('click', () => { 
      window.location.href = '../user admin/index.html'; 
    });
    
    window.sendMessage = sendMessage;
    loadData();
  </script>
</body>
</html>
